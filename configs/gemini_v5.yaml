# §0.6 stronger-model sensitivity check -- V5-gemini cell (ADR-047).
#
# V5 = agents + Phase 5 calibration, generated by Gemini instead of the local
# 7B. Inherits configs/gemini_base.yaml (Gemini provider + cost guard) and adds
# exactly the agent and calibration blocks the 7B V5 cell ran with.
#
# The calibration weights below are COPIED VERBATIM from configs/v5.yaml. They
# are NOT refit for Gemini: refitting would change the scoring rule, and §1.0d
# tests the generator while holding every other component fixed. A frozen-weight
# V5 under a different generator is the honest comparison; a refit one would
# confound "stronger model" with "different scoring rule".
_extends: gemini_base.yaml

llm:
  # Inherited from gemini_base.yaml, restated explicitly (ADR-048). Belt and
  # braces: the cache KEY must be right (it mixes in the model id) and the
  # directories must also be physically separate, so a key collision with the
  # Ollama cache cannot silently replay 7B answers into a Gemini cell.
  cache_namespace_by_provider_model: true

agents:
  enabled: true
  epsilon: 1
  max_rounds: 2
  max_llm_calls_per_question: 12
  max_evidence: 12
  evidence_split: [8, 4]
  kg_slot_rerank: true
  hypothesis_sample: false
  hypothesis_temperature: 0.0
  source_precedence: [kg, textbook, pubmed_abstract]
  prompt_versions:
    hypothesis: v1
    audit: v1
    conflict: v2

calibration:
  enabled: true
  alpha: -0.013896237159311542
  beta: 0.10976837687736825
  gamma: 0.2948559455824592
  delta: 0.007722670183812638
  temperature: 0.21447181570951504
  abstention_tau: 0.5457648774612578
  n_ece_bins: 15
  ece_binning: equal_width
  fit_dataset: medqa
  fit_split: train
  fit_limit: 60
  fit_seed: 42
