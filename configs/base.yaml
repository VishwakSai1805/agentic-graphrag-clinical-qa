seed: 42

cache_dir: .cache/llm

# Eval-run concurrency/keep-alive. See docs/04_EVALUATION.md §0.4-0.5, ADR-006.
# concurrency must match OLLAMA_NUM_PARALLEL (.env.example) for the harness's
# semaphore to actually saturate the server; ollama_keep_alive is informational
# here — the effective setting is the OLLAMA_KEEP_ALIVE env var on the server.
eval:
  concurrency: 4
  ollama_keep_alive: -1

# Tri-modal retrieval: chunking, dense (MedCPT dual encoder + FAISS), BM25,
# RRF fusion (k=60 fixed, ADR-002) and MedCPT cross-encoder rerank. Index
# artifacts live under indexes/ (gitignored, always rebuilt from
# data/processed/corpus.jsonl by scripts/build_corpus.py) with a manifest
# recording model/params/counts -- never hand-edited. See ADR-010, ADR-011.
retrieval:
  chunk_tokens: 256
  chunk_overlap: 32
  tokenizer_model: ncbi/MedCPT-Article-Encoder
  top_k_dense: 50
  top_k_bm25: 50
  top_k_rerank: 12
  dense:
    model_type: medcpt   # medcpt (asymmetric dual encoder, ADR-010) | bge (symmetric fallback)
    query_model: ncbi/MedCPT-Query-Encoder
    article_model: ncbi/MedCPT-Article-Encoder
    bge_model: BAAI/bge-large-en-v1.5
    bge_query_prefix: "Represent this sentence for searching relevant passages: "
    device: null            # null -> auto (cuda if available, else cpu)
    batch_size: 64
    max_query_length: 64
    max_article_length: 512
    nlist: 100
    nprobe: 16
    checkpoint_every_batches: 25
  bm25:
    k1: 1.5
    b: 0.75
  fusion:
    rrf_k: 60              # ADR-002: fixed, do not change without a new ADR
  rerank:
    model: ncbi/MedCPT-Cross-Encoder
    max_length: 512
  corpus:
    pubmed_subset_size: 20000   # fixed-seed subset of pqa_artificial (211k rows)
    pubmed_seed: 42

# Knowledge graph (Phase 2): PrimeKG loaded into Neo4j 5 (docker/compose.yaml).
# neo4j_password_env names an *env var*, never a literal password (see
# .env.example: NEO4J_PASSWORD). Per ADR-007, neo4j_uri/neo4j_user/
# neo4j_password_env are only read by scripts/load_primekg.py and
# scripts/precompute_kg_cache.py -- eval-time code reads cache_dir only via
# src/kg/traversal.py: get_subgraph_cached and never opens a Neo4j session.
# edge_allowlist/max_hops/degree_cap bound every traversal query in
# src/kg/queries.py -- see docs/03_DATASETS.md "Knowledge graph".
# NOTE: "off-label use" is PrimeKG's real kg.csv `relation` string (verified
# against the actual downloaded dump -- see src/config.py: KGConfig and the
# ADR this phase adds), not "off_label_use" as written in docs/03_DATASETS.md.
kg:
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
  neo4j_password_env: NEO4J_PASSWORD
  linker_threshold: 0.85   # scispaCy UmlsEntityLinker, tuned on 50 hand-checked items
  edge_allowlist:
    - indication
    - contraindication
    - off-label use
    - disease_phenotype_positive
    - disease_protein
    - drug_effect
    - disease_disease
  max_hops: 2
  degree_cap: 200
  # Per-question TOTAL triple cap (new this phase) -- degree_cap alone does
  # not bound a multi-seed 2-hop traversal's total size; see src/config.py:
  # KGConfig.max_triples_per_question and src/kg/traversal.py: traverse_live
  # for the real hub-explosion finding that forced this.
  max_triples_per_question: 40
  cache_dir: data/processed/kg_cache
  # kg_rerank ablation (Phase 2 follow-up, docs/05_DECISIONS.md ADR-018,
  # re-decided on a clean train-500 split by ADR-027): default False --
  # naive is raw Neo4j traversal order (a deterministic sort), not the
  # alphabetical novelty-scoring-subset selection ADR-016 fixed as a
  # different bug. The KG cache is gitignored and checksum-tracked in
  # data/MANIFEST.json (ADR-019) -- it is not, and was never, committed to
  # git. Do not flip this default; run with --kg-rerank on
  # scripts/precompute_kg_cache.py for the ablation variant, written to a
  # separate cache dir.
  kg_rerank: false
  kg_rerank_pool_size: 150

llm:
  temperature: 0.0
  seed: 42
  max_tokens: 512
  max_retries: 3
  backoff_base_s: 1.0
  # Ollama context window (tokens). Only sent on the ollama provider path.
  # 8192 fits the tri-modal EvidenceBundle prompt (12 passages + up to 40 KG
  # triples); appending KG triples last means a smaller window silently
  # truncates exactly the modality the hybrid baselines test -- see ADR-021
  # and src/llm/client.py: LLMContextBudgetError. Part of the LLM cache key.
  num_ctx: 8192
  context_completion_reserve: 512
  # Tried in order. Ollama needs no key. Groq/Gemini are skipped
  # automatically if their api_key_env is unset or empty.
  fallback_chain:
    - provider: ollama
      model: ollama/qwen2.5:7b-instruct
      api_base: http://localhost:11434
      api_key_env: null
      timeout_s: 120
    - provider: groq
      model: groq/llama-3.1-8b-instant
      api_base: null
      api_key_env: GROQ_API_KEY
      timeout_s: 30
    - provider: gemini
      model: gemini/gemini-1.5-flash
      api_base: null
      api_key_env: GEMINI_API_KEY
      timeout_s: 30
