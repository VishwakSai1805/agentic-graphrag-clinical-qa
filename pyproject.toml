[project]
name = "agentic-multi-evidence-graphrag"
version = "0.1.0"
description = "Agentic Multi-Evidence GraphRAG for Healthcare"
requires-python = ">=3.11,<3.12"
dependencies = [
    "litellm>=1.50,<2.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
