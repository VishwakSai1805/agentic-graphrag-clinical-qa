agents:
  enabled: true
  epsilon: 1
  evidence_split:
  - 8
  - 4
  hypothesis_sample: false
  hypothesis_temperature: 0.0
  kg_slot_rerank: true
  max_evidence: 12
  max_llm_calls_per_question: 12
  max_rounds: 2
  prompt_versions:
    audit: v1
    conflict: v2
    hypothesis: v1
  run_conflict: true
  source_precedence:
  - kg
  - textbook
  - pubmed_abstract
cache_dir: .cache\llm
calibration:
  abstention_tau: 0.5457648774612578
  alpha: -0.013896237159311542
  beta: 0.10976837687736825
  delta: 0.007722670183812638
  ece_binning: equal_width
  enabled: true
  fit_dataset: medqa
  fit_limit: 60
  fit_seed: 42
  fit_split: train
  gamma: 0.2948559455824592
  n_ece_bins: 15
  temperature: 0.21447181570951504
eval:
  concurrency: 4
  ollama_keep_alive: -1
kg:
  cache_dir: data\processed\kg_cache
  degree_cap: 200
  edge_allowlist:
  - indication
  - contraindication
  - off-label use
  - disease_phenotype_positive
  - disease_protein
  - drug_effect
  - disease_disease
  kg_rerank: false
  kg_rerank_pool_size: 150
  linker_threshold: 0.85
  max_hops: 2
  max_triples_per_question: 40
  neo4j_password_env: NEO4J_PASSWORD
  neo4j_uri: bolt://localhost:7687
  neo4j_user: neo4j
llm:
  api_version: v1beta
  backoff_base_s: 4.0
  cache_namespace_by_provider_model: true
  context_completion_reserve: 512
  fallback_chain:
  - api_base: null
    api_key_env: GEMINI_API_KEY
    model: gemini/gemini-3.8-flash
    provider: gemini
    timeout_s: 120.0
    unsupported_params:
    - seed
  free_tier_allowed:
  - gemini:gemini/gemini-3.8-flash
  - gemini:gemini/gemini-2.5-flash
  - gemini:gemini/gemini-3.5-flash-lite
  free_tier_only: true
  max_retries: 8
  max_tokens: 1024
  model_resolved_utc: '2026-09-12T20:02:23Z'
  num_ctx: 8192
  seed: 42
  temperature: 0.0
retrieval:
  bm25:
    b: 0.75
    k1: 1.5
  chunk_overlap: 32
  chunk_tokens: 256
  corpus:
    pubmed_seed: 42
    pubmed_subset_size: 20000
  dense:
    article_model: ncbi/MedCPT-Article-Encoder
    batch_size: 64
    bge_model: BAAI/bge-large-en-v1.5
    bge_query_prefix: 'Represent this sentence for searching relevant passages: '
    checkpoint_every_batches: 25
    device: null
    max_article_length: 512
    max_query_length: 64
    model_type: medcpt
    nlist: 100
    nprobe: 16
    query_model: ncbi/MedCPT-Query-Encoder
  fusion:
    rrf_k: 60
  rerank:
    max_length: 512
    model: ncbi/MedCPT-Cross-Encoder
  tokenizer_model: ncbi/MedCPT-Article-Encoder
  top_k_bm25: 50
  top_k_dense: 50
  top_k_rerank: 12
seed: 42
