# Neo4j 5 for the PrimeKG knowledge graph (Phase 2, docs/02_ROADMAP.md).
#
# Per ADR-007 (docs/05_DECISIONS.md), Neo4j is a *precompute-time-only*
# dependency: scripts/load_primekg.py loads the graph once, then
# scripts/precompute_kg_cache.py runs entity linking + traversal once per
# question and writes data/processed/kg_cache/. Eval-time code
# (src/kg/traversal.py: get_subgraph_cached) never opens a connection to this
# container -- it reads the cache file. `docker compose down` between the
# precompute step and any eval run is expected and safe.
#
# Memory budget: this is a 16GB host that also runs a local Ollama 7B model
# (several GB resident) plus the retrieval stack (FAISS index + embedding
# model, loaded on demand). Neo4j's own defaults (page cache scales with
# available RAM, heap defaults vary by install method) are tuned for a
# dedicated database box and would starve everything else running
# alongside it. heap_max=2G is comfortable for PrimeKG's 129k nodes / ~4M
# edges (well within a few hundred MB of graph data once indexed) plus
# headroom for the batch UNWIND loads and 1-2 hop traversal queries this
# project issues; pagecache=1G is enough to keep PrimeKG's node/relationship
# store hot without reserving RAM the LLM/retrieval stack would rather use.
# Bump both only if a real OOM/slow-query is observed -- do not raise
# preemptively.
# Fixed project name so `docker compose -f docker/compose.yaml ...` produces
# the same container/volume/network names regardless of the caller's cwd
# (Compose otherwise derives the project name from the compose file's parent
# directory, i.e. "docker", which is confusing).
name: primekg

services:
  neo4j:
    image: neo4j:5.24
    container_name: primekg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt (driver connections -- src/kg/*)
    environment:
      # Auth is "<user>/<password>", both from env vars -- never hardcoded.
      # Set NEO4J_USER / NEO4J_PASSWORD in a local, gitignored .env (see
      # .env.example for the placeholder) before `docker compose up`.
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      # neo4j:5.24 warns that dbms.memory.* is deprecated in favor of
      # server.memory.* (both still work; server.* is the non-deprecated
      # name going forward) -- set both env var spellings is unnecessary,
      # this image maps NEO4J_server_memory_* to the current setting name.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      # PrimeKG loads are single-writer, batch UNWIND transactions (see
      # src/kg/queries.py) -- no need for APOC/GDS plugins for Phase 2.
      NEO4J_PLUGINS: "[]"
    volumes:
      - primekg_neo4j_data:/data
      - primekg_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  primekg_neo4j_data:
  primekg_neo4j_logs:
